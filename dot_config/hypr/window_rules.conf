windowrule {
    name = "no gaps when only"
    match:workspace  = 21

    rounding = 0
}

windowrule {
    name = "no border when only 1 client"
    match:workspace = w[t1]

    border_size = 0
    rounding = 0
}

windowrule {
    name = "floating border"
    match:float = true

    border_size = 1
}

windowrule {
    name = no-screen-share
    match:class  = (discord|mpv|steam)

    no_screen_share = true
}

windowrule {
    name = no-screen-share-firefox
    match:class  = firefox
    match:title  = (^\[Main\].*|^\[Left Mon\].*)

    no_screen_share = true
}

$GAMES_REGEX = ^(dota2|steam_app.*|Godot|factorio)$
windowrule {
    name = "games"
    match:class  = $GAMES_REGEX

    immediate = true
    no_anim = true
    content = game
    rounding = 0
    idle_inhibit = true
    render_unfocused = true
    idle_inhibit = always
}

# Steam itself
# windowrule = workspace 5 silent, class:(steam), title:(Steam)$
# windowrule = workspace 11 silent, class:(steam), title:(Friends List)
# windowrule = tile, class:(steam), title:(Friends List)

windowrule {
    name = "steam main"
    match:class  = (steam)
    match:title  = (Steam)$

    workspace = 5 silent
    float = false
}

windowrule {
    name = "steam friend list"
    match:class  = (steam)
    match:title  = (Friends List)

    workspace = 11 silent
    tile = on
}

windowrule {
    name = "steam floatings"
    match:class  = (steam)
    match:title  = ((Steam - Browser)|(Recordings & Screenshots))

    float = true
    size = 1600 900
    center = true
    # hyprbars:no_bar = true
}

windowrule {
    name = "discord"
    match:class  = discord

    workspace = 11 silent
}

# windowrule = workspace 22 silent, class:^(teams-fortest-linux)$
# windowrule = idleinhibit always, class:^(teams-for-linux)$

windowrule {
    name = "teams"
    match:class  = ^(teams-for-linux)$

    workspace = 22 silent
    idle_inhibit = always
}

windowrule {
    name = "vivaldi main"
    match:class  = ^(Vivaldi.*)$
    match:title  = ^(Vivaldi - Vivaldi)$

    tile = true
}

$FLOAT_MIDDLE_REGEX = ^(org.pulseaudio.pavucontrol|io.missioncenter.MissionCenter|blueman-manager|xdg-desktop-portal-gtk|org.freedesktop.impl.portal.desktop.kde)$
windowrule {
    name = "float middle"
    match:class  = $FLOAT_MIDDLE_REGEX

    float = true
    size = 1280 768
    center = true
    no_anim = true
}

$FLOAT_MIDDLE_REGEX_LARGE = ^(mpv|Nsxiv|qimgv)$
windowrule {
    name = "float middle large"
    match:class  = $FLOAT_MIDDLE_REGEX_LARGE

    float = true
    size = 1600 900
    center = true
    rounding = 0
    no_anim = true
}

# windowrule = float, class:^$
# windowrule = size 1024 768, class:^xdg-desktop-portal-gtk$
# windowrule = center, class:^xdg-desktop-portal-gtk$
windowrule {
    name = "file portal"
    match:class  = ^xdg-desktop-portal-gtk$

    float = true
    size = 1024 768
    center = true
}

# windowrule = opacity 0.0 override 0.0 override,class:^(xwaylandvideobridge)$
# windowrule = noanim,class:^(xwaylandvideobridge)$
# windowrule = nofocus,class:^(xwaylandvideobridge)$
# windowrule = noinitialfocus,class:^(xwaylandvideobridge)$
windowrule {
    name = "hide xwaylandvideobridge"
    match:class  = ^(xwaylandvideobridge)$

    opacity = 0.0
    max_size = 1 1
    no_anim = true
    no_focus = true
    no_initial_focus = true
    no_blur = true
}

layerrule {
    name = "rofi"
    match:namespace = rofi

    no_anim = true
}

layerrule = match:namespace selection, no_anim onlyfans

