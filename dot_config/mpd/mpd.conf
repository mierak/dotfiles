music_directory		"~/Music"
playlist_directory	"~/.config/mpd/playlists"
log_file            "/tmp/mpd.log"
sticker_file       "~/.config/mpd/sticker.sql"

max_output_buffer_size "99999999999"
# default_permissions             "read,add,control,player"

auto_update "yes"
bind_to_address "@mpd"
bind_to_address "127.0.0.1"
bind_to_address "192.168.1.100"
bind_to_address "/tmp/mpd_socket"
restore_paused "yes"

state_file        "~/.config/mpd/state"
restore_paused    "yes"

playlist_plugin {
    name "cue"
    enabled "true"
}

playlist_plugin {
    name "pls"
    enabled "true"
}

audio_output {
	type "pipewire"
	name "pipewire"
}

audio_output {
   type                    "fifo"
   name                    "my_fifo"
   path                    "/tmp/mpd.fifo"
   format                  "44100:16:2"
}

audio_output {
   type                    "fifo"
   name                    "my_fifo2"
   path                    "/tmp/mpd2.fifo"
   format                  "44100:16:2"
}
